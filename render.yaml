services:
  - type: web
    name: product-search-mcp
    runtime: python
    buildCommand: pip install .
    startCommand: MCP_TRANSPORT=http MCP_HOST=0.0.0.0 python3 mcp_server.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: MCP_TRANSPORT
        value: http
      - key: MCP_HOST
        value: 0.0.0.0
      - key: MCP_PATH
        value: /mcp
