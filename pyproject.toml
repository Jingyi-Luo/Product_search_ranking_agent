[project]
name = "product-ranking-agent"
version = "0.1.28"
description = "Synthetic product search relevance and ranking agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0,<4",
]

[project.scripts]
product-ranking-agent = "ranking_agent.mcp_server:main"
product-search = "ranking_agent.mcp_server:main"
product-search-install-skill = "ranking_agent.install_skill:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
